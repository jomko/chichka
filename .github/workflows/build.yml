name: Production build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          SITE_URL: https://portfolio.example.org
      - name: Verify all generated routes and images
        run: |
          test -f dist/index.html
          test -f dist/uk/index.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          for route in about contact cv projects; do
            test -f "dist/$route/index.html"
            test -f "dist/uk/$route/index.html"
          done
          for slug in spivmaisternia we-selo slavalachia torban olenky cycles vertep kolo make-music-day-lviv nyzhnyj-zal zriz rozkolyada local-cultural-support; do
            test -f "dist/projects/$slug/index.html"
            test -f "dist/uk/projects/$slug/index.html"
          done
          for image in assets/marichka.webp assets/about.webp assets/m1.webp assets/m2.webp assets/m3.webp assets/images/spiv.webp assets/slavalacha.webp assets/social/og.png; do
            test -s "dist/$image"
          done
          if grep -R -l 'localhost:4321' dist --include='*.html'; then
            echo "Unexpected localhost URL in production output"
            exit 1
          fi
